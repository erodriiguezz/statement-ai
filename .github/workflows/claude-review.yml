# Generated by /sdlc-init (Claude SDLC bundle 1.3.0). Regenerate with /sdlc-update.
# Runtime checks + tech-lead review.
#   runtime-checks  re-runs the Test step (scripts/sdlc/test.sh --ci) on a clean runner, captures
#                   screenshots, and on feature-release PRs lets Claude walk the Foot Traffic Review
#                   in a real browser (Playwright MCP).
#   claude-review   Map (Sonnet) → Analyze (Opus) → Narrate (Sonnet) → three-page report, sticky PR
#                   comment with screenshots, and a status that fails while blocking findings are open.
# Budget: skips drafts and docs-only size/XS PRs (reporting success), caps turns per phase.
# Needs repo secret ANTHROPIC_API_KEY; optional repo variable STAGING_WEB_URL (before-screenshots).
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main, 'feat/**', 'bugfix/**', 'hotfix/**', 'chore/**', 'refactor/**']

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write        # push report images to the review-assets branch
  pull-requests: write
  issues: write
  id-token: write

jobs:
  runtime-checks:
    name: runtime-checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SDLC_BASE: origin/${{ github.base_ref }}
      BEFORE_URL: ${{ vars.STAGING_WEB_URL }}
      SDLC_ALLOW_NO_PLAN: ${{ contains(github.event.pull_request.labels.*.name, 'no-plan') && '1' || '' }}
      FEATURE_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'feature-release') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: parser/requirements.txt
      - run: pip install -r parser/requirements.txt pytest-cov
      - name: Test step (same script as local /test)
        run: ./scripts/sdlc/test.sh --ci ${{ env.FEATURE_RELEASE == 'true' && '--keep' || '' }}

      - name: Foot Traffic walk (feature release PRs — Claude drives the browser)
        if: env.FEATURE_RELEASE == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model sonnet --max-turns 40
            --mcp-config '{"mcpServers":{"playwright":{"command":"npx","args":["@playwright/mcp@latest","--headless","--isolated"]}}}'
            --allowedTools "Read,Write,Glob,Grep,mcp__playwright__*"
          prompt: |
            The app is running at http://localhost:3100. Read the plan in .claude/plans/ for this issue (acceptance criteria and Screens)
            and the PR body's "Foot Traffic Review" section. Walk every step in the browser exactly as a user would, plus the
            "Nearby areas" and "Edge cases" items. For each: what you did, what you saw, pass/fail, and a screenshot saved to
            .claude/artifacts/foot-traffic/. Write the results as a markdown checklist to .claude/artifacts/foot-traffic.md.
            Do not change code and do not comment on the PR.

      - name: Stop the stack
        if: always() && env.FEATURE_RELEASE == 'true'
        run: ./scripts/sdlc/test.sh --stop || true

      - name: Upload test report, screenshots, foot traffic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            .claude/test-report.json
            .claude/artifacts/
          retention-days: 14

  claude-review:
    name: claude-review
    needs: runtime-checks
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BASE: origin/${{ github.base_ref }}
      FEATURE_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'feature-release') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Decide whether to review
        id: gate
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node scripts/sdlc/pr-size.mjs "$BASE" "$SHA" --labels "$LABELS" --json > size.json || true
          label="$(node -p 'require("./size.json").label')"
          code="$(git diff --name-only "$BASE...$SHA" | grep -vE '^(docs/|.*\.md$)' | wc -l | tr -d ' ')"
          if [ "$label" = "size/XS" ] && [ "$code" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Docs-only size/XS PR — review skipped (budget)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch runtime results
        if: steps.gate.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: test-report
          path: review/runtime

      - name: Prepare
        if: steps.gate.outputs.skip == 'false'
        run: |
          mkdir -p review
          cp review/runtime/test-report.json review/test-report.json 2>/dev/null || echo '{"passed":false,"note":"runtime-checks produced no report"}' > review/test-report.json
          cp review/runtime/artifacts/foot-traffic.md review/foot-traffic.md 2>/dev/null || true
          shots="$(ls -d review/runtime/artifacts/screenshots/* 2>/dev/null | head -1)"; [ -n "$shots" ] && cp -r "$shots" review/screenshots || true
          gh pr view "$PR" --json number,title,author,body,labels,baseRefName,headRefName,additions,deletions,changedFiles > review/pr.json
          git diff "$BASE...$SHA" > review/diff.patch

      - name: Phase 1 · Map (Sonnet)
        if: steps.gate.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model sonnet --max-turns 15 --allowedTools "Read,Write,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            Follow .github/sdlc/tech-lead-review/SKILL.md, Phase 1 · Map only.
            PR metadata is in review/pr.json, the diff in review/diff.patch (base ${{ env.BASE }}).
            Write review/clusters.json and nothing else. Do not comment on the PR.

      - name: Phase 2 · Analyze (Opus)
        if: steps.gate.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model opus --max-turns 25 --allowedTools "Read,Write,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*),Bash(gh pr list:*)"
          prompt: |
            Follow .github/sdlc/tech-lead-review/SKILL.md, Phase 2 · Analyze only, as the technical lead.
            ${{ env.FEATURE_RELEASE == 'true' && 'This PR is labelled feature-release: use INTEGRATION MODE from the skill.' || '' }}
            Inputs: review/clusters.json, review/pr.json, review/diff.patch, review/test-report.json, review/foot-traffic.md (if present),
            the plan in .claude/plans/ for this issue, CLAUDE.md, docs/context/.
            Write review/risks.json and nothing else. Do not comment on the PR.

      - name: Phase 3 · Narrate (Sonnet)
        if: steps.gate.outputs.skip == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --model sonnet --max-turns 15 --allowedTools "Read,Write,Glob,Grep"
          prompt: |
            Follow .github/sdlc/tech-lead-review/SKILL.md, Phase 3 · Narrate only.
            From review/clusters.json, review/risks.json and review/test-report.json, write review/report.html (from
            .github/sdlc/tech-lead-review/template.html) and review/comment.md. Leave {{PAGE1_URL}}, {{PAGE2_URL}}, {{PAGE3_URL}},
            {{PDF_URL}}, {{FOR_PRODUCT}} and {{FOOT_TRAFFIC}} as literal placeholders. Do not comment on the PR.

      - name: Render report (PDF + one PNG per page)
        if: steps.gate.outputs.skip == 'false'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/sdlc/render-report.mjs review/report.html review

      - name: Publish report and screenshots to the review-assets branch
        if: steps.gate.outputs.skip == 'false'
        id: assets
        run: |
          dir="$(mktemp -d)"; dest="pr-$PR/$SHA"
          git -C "$dir" init -q
          git -C "$dir" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$dir" fetch -q --depth 1 origin review-assets; then git -C "$dir" checkout -q review-assets; else git -C "$dir" checkout -q --orphan review-assets; fi
          mkdir -p "$dir/$dest"; cp review/page-*.png review/report.pdf "$dir/$dest/"
          [ -d review/screenshots ] && cp -r review/screenshots "$dir/$dest/screenshots"
          git -C "$dir" add .
          git -C "$dir" -c user.name="claude-review" -c user.email="actions@users.noreply.github.com" commit -qm "review assets for #$PR @ ${SHA::7}"
          git -C "$dir" push -q origin review-assets
          echo "url=https://github.com/${GITHUB_REPOSITORY}/blob/review-assets/$dest" >> "$GITHUB_OUTPUT"

      - name: Post or update the sticky comment
        if: steps.gate.outputs.skip == 'false'
        env:
          URL: ${{ steps.assets.outputs.url }}
        run: |
          node scripts/sdlc/screenshots-md.mjs review/screenshots/index.json "$URL/screenshots" > review/for-product.md || true
          { [ -s review/foot-traffic.md ] && { echo "<details><summary><b>Foot Traffic walk (Claude in the browser)</b></summary>"; echo; cat review/foot-traffic.md; echo; echo "</details>"; }; } > review/foot.md || true
          node -e '
            const fs = require("fs"); const u = process.env.URL;
            let c = fs.readFileSync("review/comment.md", "utf8")
              .replaceAll("{{PAGE1_URL}}", `${u}/page-1.png?raw=true`).replaceAll("{{PAGE2_URL}}", `${u}/page-2.png?raw=true`)
              .replaceAll("{{PAGE3_URL}}", `${u}/page-3.png?raw=true`).replaceAll("{{PDF_URL}}", `${u}/report.pdf`)
              .replaceAll("{{FOR_PRODUCT}}", fs.existsSync("review/for-product.md") ? fs.readFileSync("review/for-product.md", "utf8") : "")
              .replaceAll("{{FOOT_TRAFFIC}}", fs.existsSync("review/foot.md") ? fs.readFileSync("review/foot.md", "utf8") : "");
            fs.writeFileSync("review/comment.final.md", c);
          '
          id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | contains("<!-- claude-tech-lead-review -->")) | .id' | head -1)"
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@review/comment.final.md >/dev/null
          else gh pr comment "$PR" --body-file review/comment.final.md; fi

      - name: Upload report
        if: always() && steps.gate.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tech-lead-review
          path: review/
          retention-days: 30

      - name: Merge gate (blocking findings)
        if: steps.gate.outputs.skip == 'false'
        env:
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'review-override') }}
        run: |
          blocking="$(node -p 'const r=require("./review/risks.json");(r.findings||[]).filter(f=>f.blocking).length')"
          echo "Blocking findings: $blocking" >> "$GITHUB_STEP_SUMMARY"
          if [ "$blocking" != "0" ]; then
            if [ "$OVERRIDE" = "true" ]; then echo "::warning::$blocking blocking finding(s) overridden by the review-override label — record why in the PR."; exit 0; fi
            echo "::error::$blocking blocking finding(s). Fix them (push, or comment @claude fix F1), or a maintainer adds review-override with a reason."; exit 1
          fi
