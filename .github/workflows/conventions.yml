# Generated by sdlc-init (Claude SDLC bundle 1.3.0). Regenerate with "update the sdlc".
# Harness-neutral gate: the conventions and secret rules that Claude Code hooks enforce locally,
# enforced again here so they hold for any agent, editor or human. CI is the control point.
name: Conventions

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, 'feat/**', 'bugfix/**', 'hotfix/**', 'chore/**', 'refactor/**']

permissions:
  contents: read

jobs:
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Branch, commits, PR title, attribution
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          printf '%s' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/sdlc/conventions.mjs \
            --base origin/${{ github.base_ref }} --head ${{ github.event.pull_request.head.sha }} \
            --branch "$HEAD_REF" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"

  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (commits in this PR)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --no-banner \
            --log-opts "origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}"
