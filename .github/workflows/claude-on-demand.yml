# Generated by /sdlc-init (Claude SDLC bundle 1.3.0). Regenerate with /sdlc-update.
# On-demand Claude, triggered by mentioning @claude in a PR comment or review comment
# (for example "@claude fix F1"). The automatic tech-lead review lives in claude-review.yml.
# Budget: Sonnet, capped turns, and at most 2 Claude fix commits per PR before a human looks.
# Needs the ANTHROPIC_API_KEY repo secret.
name: Claude on demand

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: >
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Fix cap (2 per PR)
        id: cap
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          n="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate -q '.[] | select((.author.login // "") | test("claude"; "i")) | .sha' | wc -l | tr -d ' ')"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge 2 ]; then
            gh pr comment "$PR" --body "Claude has already pushed $n fix commits to this PR (budget cap: 2). A human should look before more automated fixes."
          fi

      - name: Checkout
        if: steps.cap.outputs.count < 2
        uses: actions/checkout@v4

      - name: Run Claude Code
        if: steps.cap.outputs.count < 2
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          settings: '{"includeCoAuthoredBy": false}'
          claude_args: >-
            --model sonnet --max-turns 30
            --append-system-prompt "Commit subjects: 'type: description', lowercase, imperative, max 72 characters, no scope, no period. Never add Claude attribution: no Co-Authored-By trailer, no 'Generated with Claude Code'."
