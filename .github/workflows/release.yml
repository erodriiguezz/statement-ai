# Generated by /sdlc-init (Claude SDLC bundle 1.3.0). Regenerate with /sdlc-update.
# After a release/<version> PR merges into main (prepared by the /release command):
# tags v<version>, creates the GitHub release from CHANGELOG.md, and posts each
# issue's PM update from docs/releases/<version>.md as a comment on that issue.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Tag and release
        id: rel
        run: |
          v="${GITHUB_HEAD_REF:-${{ github.event.pull_request.head.ref }}}"; v="${v#release/}"; v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          awk -v v="$v" '/^## /{p = index($0, v) > 0} p' CHANGELOG.md > notes.md || true
          gh release create "v$v" --target "${{ github.event.pull_request.merge_commit_sha }}" --title "v$v" --notes-file notes.md
      - name: Post ticket updates
        run: |
          f="docs/releases/${{ steps.rel.outputs.version }}.md"
          [ -f "$f" ] || { echo "No $f — no ticket updates to post."; exit 0; }
          node -e '
            const fs = require("fs"); const { execFileSync } = require("child_process");
            const text = fs.readFileSync(process.argv[1], "utf8");
            for (const part of text.split(/^## (?=#\d+)/m).slice(1)) {
              const n = part.match(/^#(\d+)/)[1];
              const body = `**Shipped in v${process.argv[2]}**\n\n` + part.split("\n").slice(1).join("\n").replace(/^### /gm, "## ").replace(/^#### /gm, "### ");
              execFileSync("gh", ["issue", "comment", n, "--body", body], { stdio: "inherit" });
            }
          ' "$f" "${{ steps.rel.outputs.version }}"
