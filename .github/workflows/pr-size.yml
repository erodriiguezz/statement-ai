# Generated by /sdlc-init (Claude SDLC bundle 1.3.0). Regenerate with /sdlc-update.
# PR size standard (docs/claude-sdlc/SETUP.md → Layer 4). Labels every PR size/XS…XL and
# fails a single PR over 400 counted lines unless labelled size-exception or feature-release.
name: PR size

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
    branches: [main, 'feat/**', 'bugfix/**', 'hotfix/**', 'chore/**', 'refactor/**']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  pr-size:
    name: pr-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure
        id: size
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node scripts/sdlc/pr-size.mjs origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }} --labels "$LABELS" --json > size.json || true
          echo "label=$(node -p 'require("./size.json").label')" >> "$GITHUB_OUTPUT"
          node scripts/sdlc/pr-size.mjs origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }} --labels "$LABELS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          LABEL: ${{ steps.size.outputs.label }}
        run: |
          for l in size/XS size/S size/M size/L size/XL; do gh label create "$l" --color ededed --force >/dev/null; done
          for l in size-exception feature-release review-override no-plan; do gh label create "$l" --color fbca04 --force >/dev/null; done
          current="$(gh pr view "$PR" --json labels -q '.labels[].name' | grep '^size/' || true)"
          for l in $current; do [ "$l" != "$LABEL" ] && gh pr edit "$PR" --remove-label "$l"; done
          gh pr edit "$PR" --add-label "$LABEL"
      - name: Context nudge (non-blocking)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        if: github.event.action == 'opened'
        run: |
          changed="$(git diff --name-only origin/${{ github.base_ref }}...${{ github.event.pull_request.head.sha }})"
          if echo "$changed" | grep -qE '^(parser/extract/profiles\.py|render\.yaml|vercel\.json|lib/db/|drizzle/)' \
             && ! echo "$changed" | grep -q '^docs/context/changes/'; then
            gh pr comment "$PR" --body "This PR changes the schema or adds a service/app but has no context fragment. Add \`docs/context/changes/<issue>-<slug>.md\` so the next release updates docs/context (see docs/claude-sdlc/SETUP.md)."
          fi
      - name: Enforce
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/sdlc/pr-size.mjs origin/${{ github.base_ref }} ${{ github.event.pull_request.head.sha }} --labels "$LABELS"
